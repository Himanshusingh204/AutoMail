name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v7
      # window tests skip themselves where there is no display (Linux runner)
      - run: uv run --extra dev pytest -q
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v7
      - run: uv venv && uv pip install -e ".[dev]" pip-audit && .venv/bin/pip-audit --skip-editable
      # CLI full-history scan: the action diffs `first-commit^..last`, which fails when the pushed range starts at a root commit
      - run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --redact -v --exit-code 2
